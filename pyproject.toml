[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqcomp"
version = "0.2.1"
description = "Validated NorPix SEQ folder compressor and backup tool"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
keywords = ["norpix", "seq", "video", "compression", "backup", "neuroscience"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "psutil>=5.9",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "build>=1",
  "twine>=5",
]

[project.scripts]
seqcomp = "seqcomp.cli:main"

[project.urls]
Homepage = "https://github.com/jiumao2/SeqVideoCompressor"
Repository = "https://github.com/jiumao2/SeqVideoCompressor"
Issues = "https://github.com/jiumao2/SeqVideoCompressor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires the Conda FFmpeg runtime",
  "gpu: requires an NVIDIA GPU with H.265 NVENC support",
  "realdata: requires a user-provided real SEQ file",
]
